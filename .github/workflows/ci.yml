# RNF-09: ningún cambio entra a main si rompe una prueba o baja la cobertura del 80 % (pytest-cov).
# RNF-10: la imagen de la API y la pila de Compose deben construirse sin errores.
name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest   # pytest.ini exige --cov-fail-under=80
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose build api web
      - name: Compose de producción válido
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
