# RNF-10: toda la pila con un solo comando →  docker compose up -d   (web en http://localhost:8080)
name: asimetria

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: asimetria
      POSTGRES_USER: asimetria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data   # el esquema lo crea y versiona Flyway al arrancar la API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asimetria -d asimetria"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # API Java (Spring Boot). Las tareas programadas (cotizaciones, cierre diario, purga) corren dentro de la
  # API bajo bloqueos de PostgreSQL: ya no hacen falta los contenedores worker/beat de Celery.
  api:
    build: ./apps/api-java
    image: asimetria-api:2.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/asimetria
      DATABASE_USER: asimetria
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      CONFIAR_PROXY: "true"   # solo Nginx (red interna) le habla a la API
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    image: asimetria-web:1.0.0
    restart: unless-stopped
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      retries: 3
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-data:
