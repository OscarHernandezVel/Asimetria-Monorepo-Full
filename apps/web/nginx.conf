# Proxy inverso: sirve la web estática y reenvía /api, /health y /docs a la API Java (un solo origen, sin CORS).
# En AWS no se usa: CloudFront sirve la web desde S3 y enruta /api/* al ALB (infra/aws).
# En producción, Caddy (deploy/Caddyfile) termina TLS 1.3 delante de este servidor.

# Límites por IP (RNF-03/RNF-05): API general y, más estricto, autenticación (fuerza bruta distribuida).
limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64k;

  # Resolución en cada petición (DNS interno de Docker): si la API está caída, Nginx sigue sirviendo la web
  # estática y las vistas muestran su estado de error en lugar de caerse todo el sitio (RNF-05/RNF-06).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  # IP real del cliente cuando llega a través del proxy TLS (Caddy reescribe X-Forwarded-For con la IP de quien
  # le conecta, así que el cliente no puede falsificarla). Sin esto, auditoría y límites verían la IP del proxy.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CloudFront-Viewer-Address "";   # el cliente no puede suplantar su IP con esta cabecera
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # la API audita esta IP (RNF-04)
    proxy_set_header CloudFront-Viewer-Address "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;   # si la API está caída, la web falla rápido y muestra "Reintentar"
    proxy_read_timeout 15s;
  }

  location = /health {
    proxy_pass $api;
  }

  # Documentación OpenAPI (springdoc sirve Swagger UI desde la propia API): CSP propia.
  location ~ ^/(docs|swagger-ui/|openapi\.json) {
    proxy_pass $api;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
  }

  location ~* \.(css|js)$ {
    expires 1h;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
