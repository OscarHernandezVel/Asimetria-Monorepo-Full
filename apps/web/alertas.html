<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertas — Asimetría</title>
  <meta name="description" content="Configura alertas por variación porcentual o precio límite de empresas e índices.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/market.js"></script>
  <script defer src="assets/js/pages/alertas.js"></script>
</head>
<body data-protected data-nav="alertas.html">
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="app">
    <aside class="sidebar" data-sidebar></aside>

    <main class="main" id="main">
      <div class="page-head">
        <div>
          <h1>Alertas</h1>
          <p>Te avisamos cuando una empresa o el índice supere el umbral que definas. <span id="worker-estado" class="small"></span></p>
        </div>
        <button class="btn" type="button" id="btn-evaluar">Evaluar ahora</button>
      </div>

      <div class="grid" style="grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start" id="al-grid">
        <section class="card" aria-labelledby="t-nueva">
          <h2 id="t-nueva">Nueva alerta</h2>
          <form id="form-alerta" novalidate style="margin-top:16px">
            <div class="field">
              <label for="al-activo">Empresa o índice</label>
              <select class="input" id="al-activo" name="ticker"></select>
            </div>
            <fieldset class="segmented">
              <legend>Condición</legend>
              <input type="radio" name="tipo" id="tp-var" value="VARIACION_PORCENTUAL" checked><label for="tp-var">Variación %</label>
              <input type="radio" name="tipo" id="tp-pre" value="PRECIO_LIMITE"><label for="tp-pre">Precio límite</label>
            </fieldset>
            <div class="field">
              <label for="al-umbral" id="lbl-umbral">Avisar si varía más de (%)</label>
              <input class="input" id="al-umbral" name="umbral" type="number" inputmode="decimal" min="0.01" step="0.01" value="3" required aria-describedby="al-hint">
              <span class="hint" id="al-hint">Variación diaria absoluta (al alza o a la baja).</span>
            </div>
            <fieldset class="segmented">
              <legend>Canal</legend>
              <input type="radio" name="canal" id="cn-mail" value="CORREO" checked><label for="cn-mail">Correo</label>
              <input type="radio" name="canal" id="cn-push" value="PUSH"><label for="cn-push">Push</label>
            </fieldset>
            <p class="error-text" id="al-error" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">Crear alerta</button>
          </form>
        </section>

        <div class="stack">
          <section class="card" aria-labelledby="t-reglas">
            <h2 id="t-reglas">Mis reglas</h2>
            <div class="table-wrap">
              <table class="table"><thead><tr><th scope="col">Activo</th><th scope="col">Condición</th><th scope="col">Actual</th><th scope="col">Estado</th><th scope="col"><span class="sr-only">Acciones</span></th></tr></thead>
              <tbody id="reglas-body"></tbody></table>
            </div>
          </section>
          <section class="card" aria-labelledby="t-notif">
            <h2 id="t-notif">Notificaciones enviadas</h2>
            <ul class="movers" id="notif-lista" aria-live="polite"></ul>
          </section>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
